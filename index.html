
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Klantenmachine | De Blije Knip</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f2f6f1;
      color: #253b2b;
      padding: 18px;
      margin: 0;
    }
    main {
      max-width: 460px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 16px #00000012;
    }
    h1 { color: #176b47; margin-bottom: 4px; }
    h2 { margin-top: 0; font-size: 18px; }
    label { display: block; margin-top: 24px; font-weight: bold; }
    input {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 20px;
    }
    button {
      background: #176b47;
      color: white;
      border: 0;
      padding: 15px;
      border-radius: 9px;
      font-size: 17px;
      width: 100%;
      margin-top: 18px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #reader { margin-top: 20px; }
    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #edf1ed;
      overflow-wrap: anywhere;
    }
    .success { background: #d9f4df !important; color: #14532d; }
    .error { background: #ffe4e4 !important; color: #8b2020; }
  </style>
</head>
<body>
<main>
  <h1>De Klantenmachine</h1>
  <h2>De Blije Knip – Krommenie</h2>
  <p>Scan de folder om de aanbieding te registreren.</p>

  <label for="pin">Medewerkerscode</label>
  <input
    id="pin"
    type="password"
    inputmode="numeric"
    autocomplete="off"
    placeholder="Voer de pincode in"
    maxlength="10"
  >

  <button id="start" onclick="startScanner()">
    Start camera en scan folder
  </button>

  <div id="reader"></div>
  <div id="status" role="status" aria-live="polite">
    Klaar om te scannen.
  </div>
</main>

<script>
  const API_URL =
    "https://klantenmachine-api.klantenmachine.workers.dev/";

  const EXPECTED_BARCODE = "RR-BK-2026-7M4Q9T";

  let scanner = null;
  let busy = false;

  const statusEl = document.getElementById("status");
  const startButton = document.getElementById("start");
  const pinInput = document.getElementById("pin");

  function showStatus(message, type = "") {
    statusEl.textContent = message;
    statusEl.className = type;
  }

  function createRequestId() {
    return crypto.randomUUID();
  }

  async function stopScanner() {
    if (!scanner) return;
    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }
      scanner.clear();
    } catch (error) {
      console.warn("Scanner stoppen:", error);
    }
    scanner = null;
  }

  async function startScanner() {
    if (busy) return;

    const pin = pinInput.value.trim();

    if (!/^\d{6,10}$/.test(pin)) {
      showStatus("Vul eerst de medewerkerscode van 6 tot 10 cijfers in.", "error");
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      showStatus("De scanner kon niet worden geladen.", "error");
      return;
    }

    busy = true;
    startButton.disabled = true;
    showStatus("Camera wordt gestart...");

    try {
      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10 },
        async (barcode) => {
          if (!busy) return;

          // Blokkeer herhaalde callbacks tijdens de verwerking.
          busy = false;
          await stopScanner();

          if (barcode !== EXPECTED_BARCODE) {
            showStatus("Dit is niet de barcode van De Blije Knip.", "error");
            startButton.disabled = false;
            return;
          }

          startButton.disabled = true;
          showStatus("Barcode herkend. Registratie wordt verwerkt...");

          await registerScan(pin, barcode);
          startButton.disabled = false;
        }
      );

      showStatus("Camera actief. Richt op de barcode.");

    } catch (error) {
      showStatus("Camera kon niet starten: " + error, "error");
      await stopScanner();
      busy = false;
      startButton.disabled = false;
    }
  }

  async function registerScan(pin, barcode) {
    const requestId = createRequestId();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          action: "register",
          pin: pin,
          requestId: requestId,
          barcode: barcode
        })
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.message || "Registratie mislukt.");
      }

      if (result.duplicate) {
        showStatus("Deze registratie was al ontvangen.", "success");
      } else {
        showStatus(
          "✓ Aanbieding geregistreerd! Tijdstip: " +
          (result.time || ""),
          "success"
        );
      }

    } catch (error) {
      showStatus(
        "Registratie niet bevestigd: " + error.message +
        " Controleer eerst Google Sheets voordat je opnieuw scant.",
        "error"
      );
    }
  }
</script>
</body>
</html>
